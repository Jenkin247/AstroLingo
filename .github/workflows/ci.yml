# Runs on every pull request and every push to main: engine tests, app unit tests,
# Android lint, screenshots of the main screens and a debug APK the Product Owner can install on a phone.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only for the screenshots branch below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Jyotish engine tests
        run: ./gradlew -p engine test 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: App unit tests, lint and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Puts compiler, lint and test errors on the checks page as annotations, so they can be read
      # without opening the full log.
      - name: Summarise build errors
        if: failure()
        run: |
          grep -E "^e: |: error:|^\* What went wrong|^> |Error:|Caused by:| FAILED$|Exception" build.log \
            | grep -v "^> Task " | head -40 \
            | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: astrolingo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          retention-days: 14

      # Also on a branch per PR, so the screenshots can be viewed on GitHub without downloading a zip.
      - name: Publish screenshots to a branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: app/build/outputs/roborazzi
        run: |
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.png
          git commit -q -m "Screenshots for ${{ github.event.pull_request.head.sha }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/screenshots/pr-${{ github.event.pull_request.number }}

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            engine/build/reports/
            app/build/reports/
          retention-days: 14
