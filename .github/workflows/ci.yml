# Runs on every pull request and every push to main: engine tests, app unit tests,
# Android lint and a debug APK the Product Owner can install on a phone.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Jyotish engine tests
        run: ./gradlew -p engine test 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: App unit tests, lint and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Puts compiler, lint and test errors on the checks page as annotations, so they can be read
      # without opening the full log.
      - name: Summarise build errors
        if: failure()
        run: |
          grep -E "^e: |: error:|^\* What went wrong|^> |Error:|Caused by:| FAILED$|Exception" build.log \
            | grep -v "^> Task " | head -40 \
            | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: astrolingo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            engine/build/reports/
            app/build/reports/
          retention-days: 14
